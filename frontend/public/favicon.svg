<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kuralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9799C"/>
      <stop offset="100%" stop-color="#A94E73"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#51434A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="18" fill="url(#kuralGradient)"/>

  <!-- Subtle Inner Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" stroke="#FAD2E1" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Monogram K -->
  <text x="31" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="35" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" filter="url(#subtleShadow)">K</text>

  <!-- Reassuring Heart Accent at Top Right -->
  <g transform="translate(47, 16) scale(0.75)">
    <path d="M0 3 C-1.5 0, -4.5 0, -6 2 C-7.5 4, -7.5 7, -5 9.5 L0 14.5 L5 9.5 C7.5 7, 7.5 4, 6 2 C4.5 0, 1.5 0, 0 3 Z" fill="#FAD2E1" stroke="#A94E73" stroke-width="1"/>
  </g>
</svg>